<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#030006"
  >

  <title>Para mi noviecita linda ♡</title>

  <link rel="stylesheet" href="style.css">

</head>


<body>

  <!-- =====================================
       UNIVERSO
  ====================================== -->

  <canvas id="universe"></canvas>


  <!-- =====================================
       PANTALLA INICIAL
  ====================================== -->

  <section id="welcome">

    <div class="welcome-glow"></div>

    <div class="welcome-content">

      <div class="mini-title">
        PARA MI NOVIECITA LINDA ✦
      </div>


      <h1>

        felices

        <br>

        <span>3 meses</span>

      </h1>


      <p class="hint">
        toca para descubrirlo
      </p>


      <button
        id="enterButton"
        type="button"
      >
        ENTRAR ♡
      </button>

    </div>

  </section>


  <!-- =====================================
       FRASES
  ====================================== -->

  <div
    id="message"
    aria-live="polite"
  ></div>


  <!-- =====================================
       BOTÓN DE MÚSICA
  ====================================== -->

  <button
    id="musicButton"
    type="button"
    aria-label="Pausar música"
  >
    ♫
  </button>


  <!-- =====================================
       MÚSICA
  ====================================== -->

  <audio
    id="music"
    src="assets/timeless.mp3"
    preload="auto"
    loop
    playsinline
  ></audio>


  <script src="script.js"></script>

</body>

</html>
