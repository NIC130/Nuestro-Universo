             * estrellas transformándose.
             */

            drawGalaxy(
                time
            );


            drawShootingStars();


            drawPhraseStar();


            drawHeart(
                time
            );


            requestAnimationFrame(
                animate
            );

        }


        /* =====================================================
           ENTRAR
        ===================================================== */

        enter.addEventListener(
            "click",
            async () => {

                if (
                    started
                ) {

                    return;

                }


                started = true;


                startTime =
                    performance.now()*
                    .001;


                music.volume=.55;


                try {

                    await music.play();

                }

                catch(error) {

                    console.log(
                        "El navegador bloqueó el audio."
                    );

                }


                intro.classList.add(
                    "hide"
                );


                title.classList.add(
                    "show"
                );


                setTimeout(
                    startPhrases,
                    6000
                );

            }
        );


        /* =====================================================
           CONTROL MÚSICA
        ===================================================== */

        musicControl.addEventListener(
            "click",
            () => {

                if (
                    music.paused
                ) {

                    music.play()
                        .then(
                            () => {

                                musicControl
                                    .classList
                                    .add(
                                        "playing"
                                    );

                                musicControl
                                    .textContent =
                                    "❚❚";

                            }
                        )
                        .catch(
                            () => {}
                        );

                }

                else {

                    music.pause();


                    musicControl
                        .classList
                        .remove(
                            "playing"
                        );


                    musicControl
                        .textContent =
                        "♫";

                }

            }
        );


        music.addEventListener(
            "play",
            () => {

                musicControl
                    .classList
                    .add(
                        "playing"
                    );

                musicControl
                    .textContent =
                    "❚❚";

            }
        );


        music.addEventListener(
            "pause",
            () => {

                musicControl
                    .classList
                    .remove(
                        "playing"
                    );

                musicControl
                    .textContent =
                    "♫";

            }
        );


        /* =====================================================
           PARALLAX — MOUSE
        ===================================================== */

        window.addEventListener(
            "pointermove",
            event => {

                if (
                    event.pointerType ===
                    "touch"
                ) {

                    return;

                }


                targetX =
                    (
                        event.clientX-
                        W/2
                    )/
                    (
                        W/2
                    );


                targetY =
                    (
                        event.clientY-
                        H/2
                    )/
                    (
                        H/2
                    );

            },
            {
                passive:true
            }
        );


        /* =====================================================
           PARALLAX — TOUCH
        ===================================================== */

        window.addEventListener(
            "touchmove",
            event => {

                if (
                    !event.touches.length
                ) {

                    return;

                }


                const touch =
                    event.touches[0];


                targetX =
                    (
                        touch.clientX-
                        W/2
                    )/
                    (
                        W/2
                    );


                targetY =
                    (
                        touch.clientY-
                        H/2
                    )/
                    (
                        H/2
                    );

            },
            {
                passive:true
            }
        );


        /* =====================================================
           ORIENTACIÓN CELULAR
        ===================================================== */

        window.addEventListener(
            "deviceorientation",
            event => {

                if (
                    event.gamma === null ||
                    event.beta === null
                ) {

                    return;

                }


                targetX =
                    clamp(
                        event.gamma/30,
                        -1,
                        1
                    );


                targetY =
                    clamp(
                        event.beta/45,
                        -1,
                        1
                    );

            },
            {
                passive:true
            }
        );


        /* =====================================================
           INICIAR
        ===================================================== */

        resize();

        requestAnimationFrame(
            animate
        );

    </script>

</body>

</html>
