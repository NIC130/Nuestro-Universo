<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#030006">

  <title>Para mi noviecita linda ♡</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- UNIVERSO -->
  <canvas id="universe"></canvas>

  <div class="pink-glow"></div>
  <div class="vignette"></div>


  <!-- PANTALLA INICIAL -->

  <section id="intro">

    <div class="intro-content">

      <div class="small-title">
        PARA MI NOVIECITA LINDA ✦
      </div>

      <h1>
        felices
        <br>
        <span>3 meses</span>
      </h1>

      <p>
        toca para descubrirlo
      </p>

      <button id="enter" type="button">
        ENTRAR ♡
      </button>

    </div>

  </section>


  <!-- FRASES -->

  <section id="story">

    <div id="phrase"></div>

  </section>


  <!-- CONTROL DE MÚSICA -->

  <button
    id="musicButton"
    type="button"
    aria-label="Reproducir o pausar música"
  >
    ♫
  </button>


  <!-- TU CANCIÓN -->

  <audio
    id="music"
    loop
    preload="auto"
    playsinline
  >

    <source
      src="assets/timeless.mp3"
      type="audio/mpeg"
    >

  </audio>


  <script src="script.js"></script>

</body>

</html>
