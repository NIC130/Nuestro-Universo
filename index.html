<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#020006">

  <title>Nuestro Universo ♡</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <canvas id="space"></canvas>

  <div class="grain"></div>
  <div class="vignette"></div>

  <!-- PANTALLA INICIAL -->
  <section id="intro">

    <div class="intro-nebula"></div>

    <div class="intro-content">

      <p class="eyebrow">
        PARA MI NOVIECITA LINDA
      </p>

      <h1>
        Felices
        <span>3 meses</span>
      </h1>

      <p class="intro-text">
        preparé un pequeño universo para ti...
      </p>

      <button id="enter" type="button">
        <span>ENTRAR</span>
        <b>♡</b>
      </button>

    </div>

  </section>


  <!-- TÍTULO DURANTE EL UNIVERSO -->
  <div id="topTitle">
    PARA MI NOVIECITA LINDA
  </div>


  <!-- FRASES -->
  <div id="message"></div>


  <!-- MÚSICA -->
  <button id="musicControl" type="button">
    ♫
  </button>

  <audio
    id="music"
    src="assets/timeless.mp3"
    preload="auto"
    loop
    playsinline
  ></audio>


  <script src="script.js"></script>

</body>
</html>
