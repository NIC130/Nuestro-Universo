<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#08000b">

    <title>Nuestro Universo 💗</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==========================================
         PANTALLA DE ENTRADA
    =========================================== -->

    <section id="inicio" class="pantalla-inicio">

        <div class="brillo-inicio"></div>

        <div class="contenido-inicio">

            <p class="pequeno">
                PARA MI NOVIECITA LINDA
            </p>

            <h1>
                Felices 3 meses 💗
            </h1>

            <p class="subtitulo">
                Tengo un pequeño universo para ti...
            </p>

            <button id="entrar" class="boton-entrar">
                Entrar ✨
            </button>

        </div>

    </section>


    <!-- ==========================================
         UNIVERSO
    =========================================== -->

    <main id="universo-container">

        <canvas id="universo"></canvas>

        <div class="titulo-universo">
            <span>PARA MI NOVIECITA LINDA</span>
        </div>

        <!-- Las frases aparecen aquí -->
        <div id="mensaje"></div>

        <div class="corazon-final">
            ♡
        </div>

    </main>


    <!-- ==========================================
         MÚSICA
    =========================================== -->

    <audio
        id="musica"
        src="assets/timeless.mp3"
        preload="auto"
        loop
    ></audio>


    <script src="script.js"></script>

</body>
</html>
